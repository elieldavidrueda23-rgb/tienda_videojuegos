<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración consola Xbox Series S">
  <defs>
    <linearGradient id="ssbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="ssglow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#107c10" stop-opacity=".35"/>
      <stop offset="1" stop-color="#107c10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ssbg)"/>
  <rect width="800" height="600" fill="url(#ssglow)"/>
  <!-- caja compacta blanca con el ventanal circular negro -->
  <g transform="translate(400 268)">
    <rect x="-150" y="-86" width="300" height="172" rx="14" fill="#f2f2f2" stroke="#c9c9c9" stroke-width="5"/>
    <circle cx="-72" cy="0" r="54" fill="#101010"/>
    <circle cx="-72" cy="0" r="40" fill="#1c1c1c"/>
    <g fill="#2e2e2e">
      <circle cx="-72" cy="-16" r="5"/><circle cx="-58" cy="-8" r="5"/><circle cx="-58" cy="8" r="5"/>
      <circle cx="-72" cy="16" r="5"/><circle cx="-86" cy="8" r="5"/><circle cx="-86" cy="-8" r="5"/>
    </g>
    <rect x="-150" y="52" width="300" height="4" fill="#dcdcdc"/>
    <circle cx="120" cy="62" r="7" fill="#107c10"/>
    <text x="-10" y="8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#5a5a5a" letter-spacing="4">XBOX</text>
  </g>
  <ellipse cx="400" cy="146" rx="230" ry="76" fill="none" stroke="#107c10" stroke-width="14" opacity=".28" transform="rotate(12 400 146)"/>
  <ellipse cx="400" cy="146" rx="230" ry="76" fill="none" stroke="#63d663" stroke-width="6" opacity=".65" transform="rotate(12 400 146)"/>
  <text x="400" y="468" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="6">XBOX SERIES S</text>
  <text x="400" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#63d663" letter-spacing="10">ALL DIGITAL</text>
  <rect x="322" y="536" width="156" height="34" rx="17" fill="#107c10"/>
  <text x="400" y="559" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="2">512 GB SSD</text>
</svg>

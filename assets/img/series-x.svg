<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración consola Xbox Series X">
  <defs>
    <linearGradient id="sxbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a140d"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="sxglow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#107c10" stop-opacity=".5"/>
      <stop offset="1" stop-color="#107c10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sxbg)"/>
  <rect width="800" height="600" fill="url(#sxglow)"/>
  <!-- torre vertical con el ventanal circular verde -->
  <g transform="translate(400 268)">
    <rect x="-72" y="-132" width="144" height="264" rx="14" fill="#141414" stroke="#3d3d3d" stroke-width="5"/>
    <circle cx="0" cy="-84" r="44" fill="#050505" stroke="#107c10" stroke-width="6"/>
    <circle cx="0" cy="-84" r="30" fill="#0d3f0d"/>
    <g fill="#107c10">
      <circle cx="0" cy="-98" r="4"/><circle cx="14" cy="-91" r="4"/><circle cx="14" cy="-77" r="4"/>
      <circle cx="0" cy="-70" r="4"/><circle cx="-14" cy="-77" r="4"/><circle cx="-14" cy="-91" r="4"/>
      <circle cx="24" cy="-84" r="4"/><circle cx="-24" cy="-84" r="4"/>
    </g>
    <rect x="-72" y="10" width="144" height="4" fill="#2a2a2a"/>
    <circle cx="46" cy="112" r="7" fill="#63d663"/>
    <text x="-46" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8a8a8a" letter-spacing="3">POWER</text>
  </g>
  <ellipse cx="400" cy="150" rx="230" ry="80" fill="none" stroke="#107c10" stroke-width="14" opacity=".3" transform="rotate(-14 400 150)"/>
  <ellipse cx="400" cy="150" rx="230" ry="80" fill="none" stroke="#63d663" stroke-width="6" opacity=".7" transform="rotate(-14 400 150)"/>
  <text x="400" y="468" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="6">XBOX SERIES X</text>
  <text x="400" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#63d663" letter-spacing="10">POWER YOUR DREAMS</text>
  <rect x="330" y="536" width="140" height="34" rx="17" fill="#107c10"/>
  <text x="400" y="559" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="2">NEXT GEN</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración Halo Infinite para Xbox">
  <defs>
    <linearGradient id="hibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a140d"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="higlow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#107c10" stop-opacity=".5"/>
      <stop offset="1" stop-color="#107c10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#hibg)"/>
  <rect width="800" height="600" fill="url(#higlow)"/>
  <!-- anillo del halo en perspectiva -->
  <ellipse cx="400" cy="248" rx="252" ry="96" fill="none" stroke="#107c10" stroke-width="20" opacity=".35" transform="rotate(-16 400 248)"/>
  <ellipse cx="400" cy="248" rx="252" ry="96" fill="none" stroke="#63d663" stroke-width="9" opacity=".9" transform="rotate(-16 400 248)"/>
  <path d="M180 300 q220 90 440 -30" fill="none" stroke="#9be09b" stroke-width="3" opacity=".5"/>
  <!-- casco del Master Chief -->
  <g transform="translate(400 302)">
    <path d="M-70 62 v-70 a70 70 0 0 1 140 0 v70 q-70 32 -140 0 z" fill="#3c4a2f" stroke="#8a9a6a" stroke-width="5"/>
    <path d="M-50 -12 q50 -34 100 0 q-8 38 -50 44 q-42 -6 -50 -44 z" fill="#e8c400"/>
    <rect x="-70" y="16" width="140" height="8" fill="#2a3320"/>
    <rect x="-26" y="-58" width="52" height="12" rx="6" fill="#63d663"/>
  </g>
  <text x="400" y="468" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#ffffff" letter-spacing="6">HALO INFINITE</text>
  <text x="400" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#63d663" letter-spacing="10">ZETA HALO</text>
  <rect x="308" y="536" width="184" height="34" rx="17" fill="#107c10"/>
  <text x="400" y="559" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="2">SERIES X|S</text>
</svg>
